name: Release

# 二进制发布流水线：tag 推送（v*）触发，产三平台运行时 bundle 并挂到
# GitHub Release。产物里捆绑的 ONNX Runtime 与 ci.yml 的编译验证版本
# **刻意不同**：ci.yml 用 1.22.0 复现上游基线（见其注释），本流水线用
# 1.31.0 —— M5 的全部性能实测（RTF / 冷加载 / 常驻）都在 1.31.0 上
# 采集，发布产物必须与验证口径一致（docs/performance.md）。
#
# 验证路径：workflow_dispatch + dry_run —— 只走构建与 bundle，不建
# Release。新版本号 / 新 ORT 版本上线前先在 master 上 dry run 一轮。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建产物，不创建 Release（验证流水线用）"
        type: boolean
        default: true

# publish job 要创建 Release；构建 job 只需要 checkout。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ONNXRUNTIME_RELEASE_VERSION: "1.31.0"

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86-64：完整构建 + 全量 ctest + bundle。
  # ---------------------------------------------------------------------------
  build-linux-x64:
    name: release linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX Runtime (Linux x64)
        run: |
          set -euo pipefail
          V="${ONNXRUNTIME_RELEASE_VERSION}"
          ORT_DIR="$RUNNER_TEMP/onnxruntime"
          mkdir -p "$ORT_DIR"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${V}/onnxruntime-linux-x64-${V}.tgz"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$ORT_DIR" --strip-components=1
          test -f "$ORT_DIR/include/onnxruntime_cxx_api.h"
          echo "GENIE_ONNXRUNTIME_ROOT=$ORT_DIR" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset release -DGENIE_ONNXRUNTIME_ROOT="$GENIE_ONNXRUNTIME_ROOT"

      - name: Build
        run: cmake --build --preset release --parallel

      # 合成模型与"不得跳过"断言同 ci.yml 的 ort job —— 发布产物的测试
      # 口径必须与 CI 完全一致，不能因为"反正要发布"就放宽。
      - name: Generate synthetic test models
        run: |
          set -euo pipefail
          python3 -m pip install --user "onnx==1.23.2" "numpy==2.1.3"
          python3 tools/make_synthetic_model.py tests/models/synthetic/echo.onnx \
            --external-fp16 tests/models/synthetic

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Integration tests must not skip
        run: |
          set -euo pipefail
          if ! ./build/release/tests/genie_integration_tests > integration.log 2>&1; then
            cat integration.log; exit 1
          fi
          if grep -q "SKIPPED" integration.log; then
            cat integration.log
            echo "integration tests were skipped (synthetic models missing?)" >&2
            exit 1
          fi

      - name: Bundle
        run: |
          set -euo pipefail
          python3 tools/deploy/make_runtime_bundle.py \
            --build-dir build/release \
            --ort-root "$GENIE_ONNXRUNTIME_ROOT" \
            --tag linux-x64 --ort-version "${ONNXRUNTIME_RELEASE_VERSION}" \
            --output-dir dist
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-x64
          path: |
            dist/genie-tts-runtime-*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux ARM64：交叉编译（编译验证口径同 ci.yml 的 arm64 job），bundle 用
  # 同一份脚本 —— 交叉产物跳过运行冒烟、走 file 架构校验。
  # ---------------------------------------------------------------------------
  build-linux-aarch64:
    name: release linux-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu file

      - name: Download ONNX Runtime (Linux aarch64)
        run: |
          set -euo pipefail
          V="${ONNXRUNTIME_RELEASE_VERSION}"
          ORT_DIR="$RUNNER_TEMP/onnxruntime-aarch64"
          mkdir -p "$ORT_DIR"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/ort-aarch64.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${V}/onnxruntime-linux-aarch64-${V}.tgz"
          tar -xzf "$RUNNER_TEMP/ort-aarch64.tgz" -C "$ORT_DIR" --strip-components=1
          test -f "$ORT_DIR/include/onnxruntime_cxx_api.h"
          echo "GENIE_ONNXRUNTIME_ROOT=$ORT_DIR" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset arm64-release -DGENIE_ONNXRUNTIME_ROOT="$GENIE_ONNXRUNTIME_ROOT"

      - name: Build
        run: cmake --build --preset arm64-release --parallel

      - name: Verify artifacts are aarch64 and link ORT
        run: |
          set -euo pipefail
          B=build/arm64-release
          for f in "$B/tools/genie-tts" "$B/src/libgenie_tts.so"; do
            test -f "$f" || { echo "missing: $f" >&2; exit 1; }
            file "$f" | grep -q "ARM aarch64" \
              || { echo "not aarch64: $f" >&2; file "$f"; exit 1; }
          done
          readelf -d "$B/tools/genie-tts" | grep -q "libonnxruntime.so.1" \
            || { echo "genie-tts does not link onnxruntime" >&2; exit 1; }
          readelf -d "$B/src/libgenie_tts.so" | grep -q "libonnxruntime.so.1" \
            || { echo "libgenie_tts.so does not link onnxruntime" >&2; exit 1; }

      - name: Bundle
        run: |
          set -euo pipefail
          python3 tools/deploy/make_runtime_bundle.py \
            --build-dir build/arm64-release \
            --ort-root "$GENIE_ONNXRUNTIME_ROOT" \
            --tag linux-aarch64 --ort-version "${ONNXRUNTIME_RELEASE_VERSION}" \
            --output-dir dist
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-aarch64
          path: |
            dist/genie-tts-runtime-*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows x86-64：首次在发布链上启用 ORT（ci.yml 的 windows job 是
  # ORT OFF 的编译验证）。DLL 随 bundle 进 bin/，测试时把 ORT 的 bin
  # 加进 PATH。
  # ---------------------------------------------------------------------------
  build-windows:
    name: release windows-x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 同 ci.yml：不用 VS 生成器（实例探测不稳），MSVC 环境 + Ninja。
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download ONNX Runtime (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $V = $env:ONNXRUNTIME_RELEASE_VERSION
          $OrtDir = Join-Path $env:RUNNER_TEMP "onnxruntime"
          New-Item -ItemType Directory -Force -Path $OrtDir | Out-Null
          curl.exe -fsSL --retry 3 `
            -o "$env:RUNNER_TEMP\ort.zip" `
            "https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-win-x64-$V.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ort.zip" -DestinationPath $OrtDir -Force
          $Inner = Get-ChildItem $OrtDir -Directory | Select-Object -First 1
          Move-Item $Inner.FullName (Join-Path $OrtDir "root")
          if (-not (Test-Path (Join-Path $OrtDir "root\include\onnxruntime_cxx_api.h"))) {
            throw "ORT include layout unexpected"
          }
          "GENIE_ONNXRUNTIME_ROOT=$OrtDir\root" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Put ORT DLLs on PATH (for tests)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          "$env:GENIE_ONNXRUNTIME_ROOT\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Configure
        run: >
          cmake -S . -B build/windows -G Ninja
          -DGENIE_ONNXRUNTIME_ROOT="${env:GENIE_ONNXRUNTIME_ROOT}"

      - name: Build
        run: cmake --build build/windows --parallel

      - name: Generate synthetic test models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python3 -m pip install "onnx==1.23.2" "numpy==2.1.3"
          python3 tools/make_synthetic_model.py tests/models/synthetic/echo.onnx `
            --external-fp16 tests/models/synthetic

      - name: Test
        run: ctest --test-dir build/windows --output-on-failure

      - name: Integration tests must not skip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = & .\build\windows\tests\genie_integration_tests.exe 2>&1
          $log | Out-File integration.log
          if ($LASTEXITCODE -ne 0) { Get-Content integration.log; exit 1 }
          if (Select-String -Path integration.log -Pattern "SKIPPED" -Quiet) {
            Get-Content integration.log
            throw "integration tests were skipped (synthetic models missing?)"
          }

      - name: Bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python3 tools/deploy/make_runtime_bundle.py `
            --build-dir build/windows `
            --ort-root "$env:GENIE_ONNXRUNTIME_ROOT" `
            --tag windows-x64 --ort-version "${env:ONNXRUNTIME_RELEASE_VERSION}" `
            --output-dir dist
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-x64
          path: |
            dist/genie-tts-runtime-*.zip
            dist/*.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：下载三份产物，版本一致性检查（产物输出 == tag），挂 Release。
  # dry_run（workflow_dispatch）时整个 job 跳过。
  # ---------------------------------------------------------------------------
  publish:
    name: publish GitHub Release
    if: github.event_name == 'push'
    needs: [build-linux-x64, build-linux-aarch64, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version consistency check (tag == binary)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/vcheck && tar -xzf dist/genie-tts-runtime-*linux-x64.tar.gz -C /tmp/vcheck
          OUT="$(/tmp/vcheck/bin/genie-tts version | head -1)"
          echo "binary says: $OUT; tag: $TAG"
          case "$OUT" in
            *" $TAG") echo "version matches tag" ;;
            *) echo "VERSION MISMATCH: binary $OUT vs tag $TAG" >&2; exit 1 ;;
          esac

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          # 取 CHANGELOG 里 "## [<tag>]" 到下一个 "## [" 之间的内容
          python3 - "${TAG}" <<'PYEOF'
          import sys, pathlib
          tag = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## [{tag}]"
          start = text.index(marker)
          end = text.index("\n## [", start + len(marker))
          body = text[start:end].split("\n", 1)[1].strip()
          pathlib.Path("notes.md").write_text(body + "\n", encoding="utf-8")
          PYEOF
          head -5 notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/genie-tts-runtime-*
