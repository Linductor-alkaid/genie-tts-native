name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 上游 Genie-TTS 固定 onnxruntime==1.22.1（注明避免 1.23 的性能回退）。
  # 这里的版本选择是"复现上游基线"，不是"永远钉死" —— 见 docs/upstream-audit.md。
  #
  # 用 1.22.0 而非 1.22.1：1.22.1 这个补丁版**没有发布 Linux 预编译包**
  # （release 资产里只有 Windows 与 nupkg），1.22.0 才有
  # onnxruntime-linux-x64-1.22.0.tgz。两者同属 1.22.x，本项目用到的
  # ORT C++ API 在这两个版本之间没有变化。
  ONNXRUNTIME_VERSION: "1.22.0"

jobs:
  # ---------------------------------------------------------------------------
  # 最小闭环：不依赖任何外部推理后端，验证核心库与测试框架本身是健康的。
  # ---------------------------------------------------------------------------
  core:
    name: core (no ort, no kairo)
    runs-on: ubuntu-latest
    # 挂死（比如退出阶段碰到已析构的执行器）会让 job 耗到 GitHub 的默认 6 小时。
    # 给一个明确的上限，早点失败早点看见。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake --preset debug
          -DGENIE_ENABLE_ORT=OFF
          -DGENIE_ENABLE_KAIRO=OFF

      - name: Build
        run: cmake --build --preset debug --parallel

      - name: Test
        run: ctest --preset debug --output-on-failure

  # ---------------------------------------------------------------------------
  # 默认构建：启用 kairo 调度层。
  # ---------------------------------------------------------------------------
  kairo:
    name: kairo scheduler
    runs-on: ubuntu-latest
    # 挂死（比如退出阶段碰到已析构的执行器）会让 job 耗到 GitHub 的默认 6 小时。
    # 给一个明确的上限，早点失败早点看见。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --preset release --output-on-failure

  # ---------------------------------------------------------------------------
  # 真实推理：下载官方 ONNX Runtime 预编译包，跑模型契约与端到端链路测试。
  # ---------------------------------------------------------------------------
  ort:
    name: onnxruntime ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 挂死（比如退出阶段碰到已析构的执行器）会让 job 耗到 GitHub 的默认 6 小时。
    # 给一个明确的上限，早点失败早点看见。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX Runtime (Linux x64)
        run: |
          set -euo pipefail
          ORT_DIR="$RUNNER_TEMP/onnxruntime"
          mkdir -p "$ORT_DIR"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$ORT_DIR" --strip-components=1
          test -f "$ORT_DIR/include/onnxruntime_cxx_api.h"
          test -f "$ORT_DIR/lib/libonnxruntime.so" || test -f "$ORT_DIR/lib/libonnxruntime.so.${ONNXRUNTIME_VERSION}"
          echo "GENIE_ONNXRUNTIME_ROOT=$ORT_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ORT_DIR/lib" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset release -DGENIE_ONNXRUNTIME_ROOT="$GENIE_ONNXRUNTIME_ROOT"

      - name: Build
        run: cmake --build --preset release --parallel

      # C ABI 共享库的链接序回归锁：genie_core（stub create_session）与
      # genie_ort（真实现）同名配对，静态库按扫描顺序二选一 —— genie_ort
      # 必须先于 genie_core 入链。顺序错了产物照常构建、ctest 照常全绿
      # （测试走桩后端），只有运行真模型才会抛 BackendUnavailable。
      # 用 NEEDED 直接锁住：libgenie_tts.so 必须真引用 ONNX Runtime。
      - name: libgenie_tts.so must link onnxruntime
        run: |
          set -euo pipefail
          readelf -d build/release/src/libgenie_tts.so | grep -q "libonnxruntime.so.1" \
            || { echo "libgenie_tts.so lost its onnxruntime link (stub won?)" >&2; exit 1; }

      # tests/models/ 被 .gitignore 排除（生成物不入库）。不生成的话，集成
      # 测试（含 fp16 上转加载路径）与 OnnxGraph 的合成模型用例会全部
      # GTEST_SKIP —— job 是绿的，但什么也没测。生成器显式写 ir_version=8 /
      # opset 17（ORT 1.22 可读）；钉版本只为让 CI 可复现。
      - name: Generate synthetic test models
        run: |
          set -euo pipefail
          python3 -m pip install --user "onnx==1.23.2" "numpy==2.1.3"
          python3 tools/make_synthetic_model.py tests/models/synthetic/echo.onnx \
            --external-fp16 tests/models/synthetic
          ls -l tests/models/synthetic

      - name: Test
        run: ctest --preset release --output-on-failure

      # ctest 只看进程退出码，GTEST_SKIP 在 ctest 眼里也是通过 —— 单独断言
      # 集成用例全部真跑：资产缺失时在这里报错，而不是绿而空。
      - name: Integration tests must not skip
        run: |
          set -euo pipefail
          if ! ./build/release/tests/genie_integration_tests > integration.log 2>&1; then
            cat integration.log
            exit 1
          fi
          if grep -q "SKIPPED" integration.log; then
            cat integration.log
            echo "integration tests were skipped (synthetic models missing?)" >&2
            exit 1
          fi
          tail -n 3 integration.log

      - name: Smoke test the CLI
        run: ./build/release/tools/genie-tts version

  # ---------------------------------------------------------------------------
  # Sanitizer：ASan + UBSan。
  # ---------------------------------------------------------------------------
  sanitize:
    name: asan + ubsan
    runs-on: ubuntu-latest
    # 挂死（比如退出阶段碰到已析构的执行器）会让 job 耗到 GitHub 的默认 6 小时。
    # 给一个明确的上限，早点失败早点看见。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake --preset asan
          -DGENIE_ENABLE_ORT=OFF
          -DGENIE_ENABLE_KAIRO=OFF

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: ctest --preset asan --output-on-failure

  # ---------------------------------------------------------------------------
  # 线程安全：TSan 覆盖调度层。
  # ---------------------------------------------------------------------------
  thread:
    name: tsan
    runs-on: ubuntu-latest
    # 挂死（比如退出阶段碰到已析构的执行器）会让 job 耗到 GitHub 的默认 6 小时。
    # 给一个明确的上限，早点失败早点看见。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake --preset tsan
          -DGENIE_ENABLE_ORT=OFF

      - name: Build
        run: cmake --build --preset tsan --parallel

      - name: Test
        run: ctest --preset tsan --output-on-failure

  # ---------------------------------------------------------------------------
  # 跨平台：Windows 构建（不跑 ORT，CI 时间预算有限）。
  # ---------------------------------------------------------------------------
  windows:
    name: windows
    runs-on: windows-latest
    # 挂死（比如退出阶段碰到已析构的执行器）会让 job 耗到 GitHub 的默认 6 小时。
    # 给一个明确的上限，早点失败早点看见。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 把 MSVC 工具链放进环境变量后再用 Ninja 构建。
      # 不用 "Visual Studio 17 2022" 生成器：runner 上的 VS 实例探测不稳定，
      # 会报 "could not find any instance of Visual Studio"。
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build/windows -G Ninja
          -DGENIE_ENABLE_ORT=OFF
          -DGENIE_ENABLE_KAIRO=OFF

      - name: Build
        run: cmake --build build/windows --parallel

      - name: Test
        run: ctest --test-dir build/windows --output-on-failure

  # ---------------------------------------------------------------------------
  # 跨平台：Linux ARM64 交叉编译（aarch64）。
  #
  # 托管 runner 是 x86，aarch64 产物没法在本 job 里运行，所以这里只做
  # **编译验证**：交叉工具链能吃下全部源码（含测试与 OpenJTalk），
  # 链接的是 aarch64 版 ONNX Runtime，产物用 file / readelf 校验架构
  # 与 ORT 依赖。不跑 ctest —— 运行验证要在 aarch64 机器（或 qemu）上做，
  # 那是部署侧的事。
  # ---------------------------------------------------------------------------
  arm64:
    name: linux-arm64 (cross-compile)
    runs-on: ubuntu-latest
    # 交叉构建 + FetchContent（kairo / GTest）比原生构建慢，放宽一点。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-aarch64-linux-gnu file

      - name: Download ONNX Runtime (Linux aarch64)
        run: |
          set -euo pipefail
          ORT_DIR="$RUNNER_TEMP/onnxruntime-aarch64"
          mkdir -p "$ORT_DIR"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/ort-aarch64.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-aarch64-${ONNXRUNTIME_VERSION}.tgz"
          tar -xzf "$RUNNER_TEMP/ort-aarch64.tgz" -C "$ORT_DIR" --strip-components=1
          test -f "$ORT_DIR/include/onnxruntime_cxx_api.h"
          test -f "$ORT_DIR/lib/libonnxruntime.so"
          echo "GENIE_ONNXRUNTIME_ROOT=$ORT_DIR" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset arm64-release -DGENIE_ONNXRUNTIME_ROOT="$GENIE_ONNXRUNTIME_ROOT"

      - name: Build
        run: cmake --build --preset arm64-release --parallel

      # 编译验证的落点：每个关键产物都必须是 aarch64 ELF，且引擎侧
      # 二进制确实链到了 aarch64 ORT（而不是静默退化为无 ORT 构建 ——
      # Dependencies.cmake 在找不到 ORT 时会强制 GENIE_ENABLE_ORT=OFF，
      # 那样的"构建成功"对本 job 是假绿）。
      - name: Verify artifacts are aarch64 and link ORT
        run: |
          set -euo pipefail
          B=build/arm64-release
          for f in "$B/tools/genie-tts" \
                   "$B/src/libgenie_tts.so" \
                   "$B/tests/genie_unit_tests" \
                   "$B/tests/genie_integration_tests"; do
            test -f "$f" || { echo "missing: $f" >&2; exit 1; }
            file "$f" | grep -q "ARM aarch64" \
              || { echo "not aarch64: $f" >&2; file "$f"; exit 1; }
          done
          readelf -d "$B/tools/genie-tts" | grep -q "libonnxruntime.so.1" \
            || { echo "genie-tts does not link onnxruntime" >&2; exit 1; }
          readelf -d "$B/src/libgenie_tts.so" | grep -q "libonnxruntime.so.1" \
            || { echo "libgenie_tts.so does not link onnxruntime" >&2; exit 1; }
          echo "arm64 artifacts verified."

  # ---------------------------------------------------------------------------
  # 格式检查
  #
  # clang-format 的**版本**会影响输出，因此必须钉死 —— 否则 apt 装的版本一升级
  # 就会让整个仓库"格式不达标"。这里用 PyPI 的 clang-format 包锁定版本，
  # 与本地开发保持一致。
  # ---------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    # 挂死（比如退出阶段碰到已析构的执行器）会让 job 耗到 GitHub 的默认 6 小时。
    # 给一个明确的上限，早点失败早点看见。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install --user "clang-format==18.1.8"

      - name: Check formatting
        run: |
          set -euo pipefail
          find include src tools tests \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
